name: personal-external-brain

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: personal-external-brain-api:latest
    container_name: personal-external-brain-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PEB_ENV: prod
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_RELOAD: "0"
      DATA_DIR: /data
      GRAPH_PATH: /data/graph.kuzu
      WORKSPACE_STATE_PATH: /data/workspace.json
      VECTOR_PATH: /data/vectors
      VECTOR_BACKEND: lancedb
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    image: personal-external-brain-web:latest
    container_name: personal-external-brain-web
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
